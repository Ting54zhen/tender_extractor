<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>招标需求解析</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%232563eb'/%3E%3Cpath%20d='M10%207h8l5%205v13a1%201%200%200%201-1%201H10a1%201%200%200%201-1-1V8a1%201%200%200%201%201-1z'%20fill='%23fff'/%3E%3Cpath%20d='M18%207v5h5'%20fill='%23c2d8ff'/%3E%3Cpath%20d='M12.5%2016h7M12.5%2019.5h4.5'%20stroke='%232563eb'%20stroke-width='1.4'%20stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="shell">
  <main class="main">
    <div class="main-inner">

      <div class="page-top">
        <span class="badge" id="health"><span class="dot"></span><span id="health-text">检测模型中…</span></span>
        <button class="btn small" id="refresh-health">重新检测</button>
      </div>

      <section class="hero">
        <h1 class="hero-title">描述你的采购需求，<br>剩下的交给它</h1>
        <p class="hero-sub">上传采购需求报告，自动抽取结构化字段、生成可编辑的招标文件。<br>每一条结论都能回到原文证据。</p>

        <div class="composer">
          <div class="dropzone" id="drop">
            <div class="big">把需求报告拖到这里，或点击选择文件</div>
            <div class="hint">支持 .docx / .pdf / .txt · 单个文件不超过 50MB</div>
            <input type="file" id="file" accept=".docx,.pdf,.txt" hidden>
          </div>

          <div class="filebar" id="filebar">
            <span class="name" id="file-name"></span>
            <span class="size" id="file-size"></span>
            <button class="clear" id="file-clear" title="移除">&times;</button>
          </div>

          <div class="composer-bar">
            <label class="chip">项目
              <select id="project">
                <option value="">（不归属项目）</option>
              </select>
            </label>
            <div class="seg-pill">
              <label><input type="radio" name="mode" value="full" checked><span>完整链路</span></label>
              <label><input type="radio" name="mode" value="rules"><span>仅规则</span></label>
            </div>
            <label class="check"><input type="checkbox" id="force"> 强制抽取</label>
            <span class="hintline" id="run-hint">先选择一份需求报告</span>
            <button class="send" id="run" disabled title="开始解析" aria-label="开始解析">
              <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>

        <div class="sugg-tabs" id="sugg-tabs">
          <button class="sugg-tab on" data-tab="common">常用</button>
          <button class="sugg-tab" data-tab="build">生成</button>
          <button class="sugg-tab" data-tab="check">核对</button>
          <button class="sugg-tab" data-tab="keep">归档</button>
        </div>
        <div class="sugg-grid" id="sugg-grid"></div>
      </section>

  <section class="card status" id="status">
    <div class="row">
      <span class="spinner" id="spinner"></span>
      <div>
        <div style="font-weight:600" id="status-title">正在解析…</div>
        <div class="hintline" id="status-sub"></div>
      </div>
      <div style="margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums" id="status-elapsed">0.0s</div>
    </div>
    <div class="bar"><i></i></div>
  </section>

  <section class="card hidden" id="error-card">
    <div class="alert error"><div class="grow" id="error-text"></div></div>
  </section>

  <section class="hidden" id="result">
    <div class="card">
      <div class="alert warn hidden" id="skipped-banner">
        <div class="grow" id="skipped-text"></div>
        <button class="btn small" id="retry-force">仍要抽取</button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <button class="btn small" id="dl-json">下载结果 JSON</button>
        <button class="btn small" id="dl-md">下载审核报告</button>
        <button class="btn small hidden" id="dl-draft">下载平台草稿</button>
        <button class="btn small hidden" id="gen-bid">生成投标书初稿</button>
        <button class="btn small hidden" id="gen-risk">图谱风险分析</button>
        <button class="btn small hidden" id="export-pdf">导出 PDF</button>
        <button class="btn small primary hidden" id="go-fill">去填写招标文件 →</button>
        <div class="spacer"></div>
        <span class="hintline" id="result-meta"></span>
      </div>

      <div class="card hidden" id="bid-result" style="margin-top:14px">
        <div class="toolbar">
          <b>投标书初稿</b>
          <div class="spacer"></div>
          <span class="hintline" id="bid-summary"></span>
          <button class="btn small" id="dl-bid">下载投标书 .md</button>
        </div>
        <div id="bid-gaps"></div>
        <div class="md" id="bid-md"></div>
      </div>

      <div class="card hidden" id="risk-result" style="margin-top:14px">
        <div class="toolbar">
          <b>知识图谱风险分析</b>
          <div class="spacer"></div>
          <span class="hintline" id="risk-meta"></span>
          <button class="btn small" id="dl-turtle">下载图谱 .ttl</button>
        </div>
        <div id="graph-svg" style="overflow-x:auto;margin-bottom:12px"></div>
        <div class="md" id="risk-md"></div>
      </div>

      <div class="tabs">
        <button data-pane="fields" class="active">字段</button>
        <button data-pane="review">待复核</button>
        <button data-pane="template">模板映射</button>
        <button data-pane="report">审核报告</button>
      </div>

      <div class="pane active" id="pane-fields"></div>
      <div class="pane" id="pane-review"></div>
      <div class="pane" id="pane-template"></div>
      <div class="pane" id="pane-report"></div>
    </div>
  </section>

      <footer>文档仅在本机处理，不会上传到外部服务</footer>
    </div>
  </main>
</div>

<script src="/assets/shell.js"></script>
<script>
(function () {
  "use strict";

  var state = { file: null, jobId: null, timer: null, tick: null, startedAt: 0 };
  var $ = function (id) { return document.getElementById(id); };

  var STATUS_LABEL = {
    ok: ["正常", "t-ok"], low_confidence: ["低置信", "t-low"], inferred: ["推断", "t-info"],
    missing: ["缺失", "t-mute"], invalid: ["无效", "t-bad"], conflict: ["冲突", "t-bad"]
  };
  var SOURCE_LABEL = {
    label: "标签", table: "表格", regex: "正则", computed: "计算", inferred: "推断",
    llm: "模型", "rule+llm": "规则+模型", none: "无"
  };
  var PRIORITY_LABEL = { high: ["高", "t-bad"], medium: ["中", "t-warn"], low: ["低", "t-ok"] };

  function esc(text) {
    return String(text == null ? "" : text)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1024 / 1024).toFixed(1) + " MB";
  }
  function tag(label, cls) { return '<span class="tag ' + cls + '">' + esc(label) + "</span>"; }

  // ---------------- 项目选择 ----------------
  var PROJECT_KEY = "tender.currentProject";

  function loadProjects() {
    fetch("/api/projects?status=active").then(function (r) { return r.json(); })
      .then(function (data) {
        var select = $("project");
        var current = localStorage.getItem(PROJECT_KEY) || "";
        select.innerHTML = '<option value="">（不归属项目）</option>' +
          (data.projects || []).map(function (p) {
            return '<option value="' + esc(p.id) + '">' + esc(p.name) +
              "（" + p.job_count + "）</option>";
          }).join("");
        select.value = current;
        if (select.selectedIndex < 0) { select.value = ""; localStorage.removeItem(PROJECT_KEY); }
      }).catch(function () { /* 项目列表加载失败不影响解析 */ });
  }

  $("project").addEventListener("change", function () {
    if (this.value) { localStorage.setItem(PROJECT_KEY, this.value); }
    else { localStorage.removeItem(PROJECT_KEY); }
  });

  // ---------------- 模型状态 ----------------
  function loadHealth() {
    var badge = $("health");
    badge.className = "badge";
    $("health-text").textContent = "检测模型中…";
    fetch("/api/health").then(function (r) { return r.json(); }).then(function (data) {
      if (data.available) {
        badge.className = "badge ok";
        $("health-text").textContent = data.provider + " · " + data.model;
        badge.title = "模型可用" + (data.models && data.models.length ? "，可选模型：" + data.models.join("、") : "");
      } else {
        badge.className = "badge bad";
        $("health-text").textContent = "模型不可用";
        badge.title = data.reason || "无法连接模型服务";
      }
    }).catch(function () {
      badge.className = "badge bad";
      $("health-text").textContent = "无法获取状态";
    });
  }

  // ---------------- 文件选择 ----------------
  function setFile(file) {
    if (!file) {
      state.file = null;
      $("filebar").classList.remove("show");
      $("run").disabled = true;
      $("run-hint").textContent = "先选择一份需求报告";
      return;
    }
    var lower = file.name.toLowerCase();
    var okExt = /\.(docx|pdf|txt)$/.test(lower);
    if (!okExt) {
      showError("不支持的文件类型：" + file.name + "，仅支持 .docx / .pdf / .txt");
      return;
    }
    if (file.size > 50 * 1024 * 1024) {
      showError("文件超过 50MB 上限");
      return;
    }
    state.file = file;
    $("file-name").textContent = file.name;
    $("file-size").textContent = fmtSize(file.size);
    $("filebar").classList.add("show");
    $("run").disabled = false;
    $("run-hint").textContent = "准备就绪";
    hideError();
  }

  $("drop").addEventListener("click", function () { $("file").click(); });
  $("file").addEventListener("change", function (e) { setFile(e.target.files[0]); });
  ["dragenter", "dragover"].forEach(function (name) {
    $("drop").addEventListener(name, function (e) {
      e.preventDefault(); $("drop").classList.add("over");
    });
  });
  ["dragleave", "drop"].forEach(function (name) {
    $("drop").addEventListener(name, function (e) {
      e.preventDefault(); $("drop").classList.remove("over");
    });
  });
  $("drop").addEventListener("drop", function (e) {
    if (e.dataTransfer.files && e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
  });
  $("file-clear").addEventListener("click", function (e) {
    e.stopPropagation(); $("file").value = ""; setFile(null);
  });
  $("refresh-health").addEventListener("click", loadHealth);

  // ---------------- 提交与轮询 ----------------
  function currentMode() {
    var checked = document.querySelector('input[name="mode"]:checked');
    return checked ? checked.value : "full";
  }

  function startExtraction(force) {
    if (!state.file) { showError("请先选择文件"); return; }
    hideError();
    $("result").classList.add("hidden");
    $("skipped-banner").classList.add("hidden");
    var query = "/api/extract?filename=" + encodeURIComponent(state.file.name) +
      "&use_llm=" + (currentMode() === "full" ? "1" : "0") +
      "&allow_non_tender=" + (force || $("force").checked ? "1" : "0") +
      "&project_id=" + encodeURIComponent($("project").value || "");

    $("status").classList.add("show");
    $("status-title").textContent = "正在上传…";
    $("status-sub").textContent = state.file.name;
    $("run").disabled = true;
    $("run-hint").textContent = "解析中，请稍候";

    fetch(query, { method: "POST", body: state.file })
      .then(function (r) {
        return r.json().then(function (data) {
          if (!r.ok) throw new Error(data.error || ("请求失败 " + r.status));
          return data;
        });
      })
      .then(function (job) {
        state.jobId = job.id;
        beginTicking();
        poll(job.id);
      })
      .catch(function (err) {
        stopTicking();
        $("status").classList.remove("show");
        $("run").disabled = false;
        $("run-hint").textContent = "准备就绪";
        showError(err.message || String(err));
      });
  }

  function beginTicking() {
    stopTicking();
    state.startedAt = Date.now();
    state.tick = setInterval(function () {
      $("status-elapsed").textContent = ((Date.now() - state.startedAt) / 1000).toFixed(1) + "s";
    }, 100);
  }
  function stopTicking() {
    if (state.tick) { clearInterval(state.tick); state.tick = null; }
  }

  function poll(jobId) {
    fetch("/api/jobs/" + jobId).then(function (r) { return r.json(); }).then(function (job) {
      $("status-title").textContent = job.stage || "处理中";
      if (job.status === "queued" || job.status === "running") {
        $("status-sub").textContent = job.use_llm
          ? "规则抽取 + 本地模型补缺，长文档可能需要 1 分钟"
          : "仅规则抽取，通常几秒完成";
        state.timer = setTimeout(function () { poll(jobId); }, 900);
        return;
      }
      stopTicking();
      $("status").classList.remove("show");
      $("run").disabled = false;
      $("run-hint").textContent = "准备就绪";
      if (job.status === "error") { showError(job.error || "解析失败"); return; }
      loadResult(job);
    }).catch(function (err) {
      stopTicking();
      $("status").classList.remove("show");
      $("run").disabled = false;
      showError("获取任务状态失败：" + (err.message || err));
    });
  }

  function loadResult(job) {
    Promise.all([
      fetch("/api/jobs/" + job.id + "/result").then(function (r) { return r.json(); }),
      fetch("/api/jobs/" + job.id + "/report").then(function (r) { return r.json(); })
    ]).then(function (pair) {
      render(job, pair[0], pair[1].markdown || "");
      bindGoFill(job);
    }).catch(function (err) {
      showError("读取结果失败：" + (err.message || err));
    });
  }

  // 抽取成功后在工具栏露出「去填写招标文件」入口
  function bindGoFill(job) {
    var btn = $("go-fill");
    var ok = job.status === "done" && !(job.summary && job.summary.skipped);
    btn.classList.toggle("hidden", !ok);
    btn.onclick = ok ? function () {
      window.location.href = "/fill.html?job=" + job.id;
    } : null;
    var bid = $("gen-bid");
    bid.classList.toggle("hidden", !ok);
    bid.onclick = ok ? function () { generateBid(job); } : null;
    var risk = $("gen-risk");
    risk.classList.toggle("hidden", !ok);
    risk.onclick = ok ? function () { analyzeRisk(job); } : null;
    var pdf = $("export-pdf");
    pdf.classList.toggle("hidden", !ok);
    pdf.onclick = ok ? function () { exportPdf(job); } : null;
  }

  // 通用二进制下载（POST 后 blob 保存）
  function downloadBinary(url, fallbackName, btn) {
    if (btn) { btn.disabled = true; }
    fetch(url, { method: "POST" })
      .then(function (r) {
        if (!r.ok) {
          return r.json().then(function (data) {
            throw new Error(data.error || ("请求失败 " + r.status));
          });
        }
        var disp = r.headers.get("Content-Disposition") || "";
        var m = /filename\*=UTF-8''([^;]+)/.exec(disp);
        var name = m ? decodeURIComponent(m[1]) : fallbackName;
        return r.blob().then(function (blob) { saveBlob(blob, name); });
      })
      .catch(function (err) { showError((err.message || err)); })
      .finally(function () { if (btn) { btn.disabled = false; } });
  }

  function saveBlob(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function exportPdf(job) {
    downloadBinary("/api/jobs/" + job.id + "/export/pdf",
      (job.filename || "招标文件").replace(/\.[^.]+$/, "") + ".pdf", $("export-pdf"));
  }

  // ---------------- 投标书初稿 ----------------
  function generateBid(job) {
    var btn = $("gen-bid");
    btn.disabled = true;
    btn.textContent = "生成中…";
    fetch("/api/jobs/" + job.id + "/bid", { method: "POST" })
      .then(function (r) {
        return r.json().then(function (data) {
          if (!r.ok) throw new Error(data.error || ("请求失败 " + r.status));
          return data;
        });
      })
      .then(function (data) {
        renderBid(data);
      })
      .catch(function (err) {
        showError("投标书生成失败：" + (err.message || err));
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "生成投标书初稿";
      });
  }

  function renderBid(data) {
    $("bid-result").classList.remove("hidden");
    var s = data.summary || {};
    $("bid-summary").textContent =
      "资格响应 " + (s.covered || 0) + "/" + (s.qualifications || 0) +
      " · 技术方案 " + (s.sections || 0) + " 节 · 缺口 " + (s.gaps || 0) + " 项";
    var gaps = data.gaps || [];
    $("bid-gaps").innerHTML = gaps.length
      ? '<div class="alert warn"><div class="grow"><b>材料缺口 ' + gaps.length +
        " 项：</b>" + gaps.map(function (g) {
            return esc(g.requirement) + "→" + esc(g.need);
          }).join("；") + "</div></div>"
      : "";
    $("bid-md").innerHTML = '<div class="md">' + mdToHtml(data.markdown || "") + "</div>";
    $("dl-bid").onclick = function () {
      var blob = new Blob([data.markdown || ""], { type: "text/markdown;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (s.project_name || "投标书") + "-投标书初稿.md";
      a.click();
      URL.revokeObjectURL(a.href);
    };
    $("bid-result").scrollIntoView({ behavior: "smooth" });
  }

  // ---------------- 知识图谱风险分析 ----------------
  function analyzeRisk(job) {
    var btn = $("gen-risk");
    btn.disabled = true;
    btn.textContent = "分析中…";
    fetch("/api/jobs/" + job.id + "/analyze", { method: "POST" })
      .then(function (r) {
        return r.json().then(function (data) {
          if (!r.ok) throw new Error(data.error || ("请求失败 " + r.status));
          return data;
        });
      })
      .then(function (data) {
        renderRisk(data);
      })
      .catch(function (err) {
        showError("图谱分析失败：" + (err.message || err));
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "图谱风险分析";
      });
  }

  function renderRisk(data) {
    $("risk-result").classList.remove("hidden");
    var g = data.graph || {};
    var types = {};
    (g.nodes || []).forEach(function (n) {
      types[n.type] = (types[n.type] || 0) + 1;
    });
    var note = data.meta && data.meta.error ? " · 注意：" + data.meta.error : "";
    $("risk-meta").textContent =
      "节点 " + (g.nodes || []).length + " 个（" +
      Object.keys(types).map(function (t) { return t + "×" + types[t]; }).join("、") +
      "）· 关系 " + (g.edges || []).length + " 条" + note;
    $("graph-svg").innerHTML = renderGraphSvg(g);
    $("risk-md").innerHTML = '<div class="md">' + mdToHtml(data.knowledge_report || "") + "</div>";
    $("dl-turtle").onclick = function () {
      var blob = new Blob([data.turtle || ""], { type: "text/turtle;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (data.project_name || "图谱") + ".ttl";
      a.click();
      URL.revokeObjectURL(a.href);
    };
    $("risk-result").scrollIntoView({ behavior: "smooth" });
  }

  // 按类型分列的简单图谱布局（无第三方库）
  function renderGraphSvg(g) {
    var COLUMN_ORDER = [
      ["Project", "项目"],
      ["ProcurementItem", "采购标的"],
      ["Qualification", "资格要求"],
      ["ScoringCriterion", "评分点"],
      ["DisqualificationClause", "废标条款"],
    ];
    var COLORS = {
      Project: "#2563eb", ProcurementItem: "#059669", Qualification: "#b45309",
      ScoringCriterion: "#7c3aed", DisqualificationClause: "#dc2626",
    };
    var columns = {};
    var order = [];
    (g.nodes || []).forEach(function (n) {
      if (!columns[n.type]) { columns[n.type] = []; order.push(n.type); }
      columns[n.type].push(n);
    });
    order.sort(function (a, b) {
      var ia = COLUMN_ORDER.findIndex(function (c) { return c[0] === a; });
      var ib = COLUMN_ORDER.findIndex(function (c) { return c[0] === b; });
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    var pos = {};
    var COL_W = 240, NODE_H = 44, GAP = 14, MAX_PER_COL = 8;
    var width = order.length * COL_W + 40;
    var maxRows = 1;
    order.forEach(function (type, ci) {
      var list = columns[type].slice(0, MAX_PER_COL);
      maxRows = Math.max(maxRows, list.length);
      list.forEach(function (n, ri) {
        pos[n.id] = { x: 20 + ci * COL_W, y: 40 + ri * (NODE_H + GAP), type: type, label: n.label };
      });
    });
    var height = 60 + maxRows * (NODE_H + GAP);
    function esc2(t) {
      return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    var svg = '<svg width="' + width + '" height="' + height + '" style="font:12px sans-serif">';
    (g.edges || []).forEach(function (e) {
      var s = pos[e.source], t = pos[e.target];
      if (!s || !t) return;
      var x1 = s.x + 190, y1 = s.y + NODE_H / 2, x2 = t.x, y2 = t.y + NODE_H / 2;
      svg += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
        '" stroke="#cbd5e1" stroke-width="1.2"><title>' + esc2(e.predicate) + "</title></line>";
    });
    order.forEach(function (type, ci) {
      var list = columns[type].slice(0, MAX_PER_COL);
      var head = (COLUMN_ORDER.find(function (c) { return c[0] === type; }) || [type, type])[1];
      svg += '<text x="' + (20 + ci * COL_W) + '" y="24" fill="#6b7280" font-weight="600">' +
        esc2(head) + "（" + columns[type].length + "）</text>";
      list.forEach(function (n) {
        var p = pos[n.id];
        var color = COLORS[type] || "#6b7280";
        svg += '<rect x="' + p.x + '" y="' + p.y + '" width="190" height="' + NODE_H +
          '" rx="9" fill="#fff" stroke="' + color + '" stroke-width="1.4">' +
          "<title>" + esc2(n.label) + "</title></rect>";
        var label = n.label.length > 16 ? n.label.slice(0, 15) + "…" : n.label;
        svg += '<text x="' + (p.x + 10) + '" y="' + (p.y + 20) + '" fill="#111827">' + esc2(label) + "</text>";
        if (n.properties && n.properties.value) {
          var v = String(n.properties.value).slice(0, 12);
          svg += '<text x="' + (p.x + 10) + '" y="' + (p.y + 35) + '" fill="#9ca3af">' + esc2(v) + "</text>";
        }
      });
      if (columns[type].length > MAX_PER_COL) {
        svg += '<text x="' + (20 + ci * COL_W) + '" y="' + (40 + MAX_PER_COL * (NODE_H + GAP)) +
          '" fill="#9ca3af">… 另有 ' + (columns[type].length - MAX_PER_COL) + " 个</text>";
      }
    });
    svg += "</svg>";
    return svg;
  }

  // ---------------- 渲染 ----------------
  function render(job, data, markdown) {
    var summary = job.summary || {};
    document.body.classList.add("has-result");
    $("result").classList.remove("hidden");

    if (job.status === "skipped" || summary.skipped) {
      $("skipped-banner").classList.remove("hidden");
      $("skipped-text").innerHTML = "<b>未执行抽取：</b>" +
        esc(summary.reject_reason || "该文件未被识别为招标/采购需求文件") +
        "<br>如确认文件类型无误，可以强制抽取。";
    }

    var stats = [
      ["字段有值", summary.fields_with_value || 0, ""],
      ["模板覆盖", (summary.templates_filled || 0) + " / " + (summary.templates_total || 0), ""],
      ["高风险复核", summary.high || 0, summary.high ? "color:var(--red)" : ""],
      ["中风险复核", summary.medium || 0, summary.medium ? "color:var(--amber)" : ""],
      ["用时", (job.elapsed || 0).toFixed ? job.elapsed.toFixed(1) + "s" : job.elapsed + "s", ""]
    ];
    $("stats").innerHTML = stats.map(function (item) {
      return '<div class="stat"><div class="k">' + esc(item[0]) + '</div><div class="v" style="' +
        item[2] + '">' + esc(item[1]) + "</div></div>";
    }).join("");

    var modelText = summary.model
      ? "模型：" + summary.provider + " / " + summary.model
      : "模型：未使用";
    var rv = summary.review || {};
    var reviewText = "";
    if (rv.enabled) {
      reviewText = rv.available
        ? " · 第三方复核：" + rv.provider + "/" + rv.model +
          "（通过 " + rv.supported + "，驳回 " + rv.rejected + "，改为 " + rv.replaced + "）"
        : " · 第三方复核未生效" + (rv.error ? "：" + rv.error : "");
    }
    $("result-meta").textContent = "文件：" + job.filename + " · " + modelText + reviewText;

    renderFields(data.fields || {});
    renderReview(data.review || []);
    renderTemplates(data.template_values || {}, data.missing_templates || []);
    $("pane-report").innerHTML = '<div class="md">' + mdToHtml(markdown) + "</div>";

    var dl = job.downloads || {};
    bindDownload($("dl-json"), dl.json);
    bindDownload($("dl-md"), dl.md);
    bindDownload($("dl-draft"), dl.draft);
    $("dl-draft").classList.toggle("hidden", !dl.draft);
  }

  function bindDownload(btn, url) {
    if (!url) { btn.classList.add("hidden"); return; }
    btn.classList.remove("hidden");
    btn.onclick = function () { window.location.href = url; };
  }

  function renderFields(fields) {
    var keys = Object.keys(fields);
    if (!keys.length) { $("pane-fields").innerHTML = '<div class="empty">没有字段结果</div>'; return; }
    var rows = keys.map(function (key) {
      var f = fields[key];
      var st = STATUS_LABEL[f.status] || [f.status || "", "t-mute"];
      var evidence = (f.evidence || []).map(function (e) {
        return '<div class="ev"><b>' + esc(e.block_id || "") + (e.section ? " · " + esc(e.section) : "") +
          '</b> ' + esc(e.quote || "") + "</div>";
      }).join("");
      var empty = f.value === null || f.value === undefined || f.value === "";
      var note = f.notes ? '<div class="ev">' + esc(f.notes) + "</div>" : "";
      return '<tr class="' + (empty ? "dim" : "") + '">' +
        "<td>" + esc(f.label || key) + "</td>" +
        '<td class="val">' + (empty ? '<span style="color:#9ca3af">—</span>' : esc(f.value)) + note + "</td>" +
        "<td>" + tag(st[0], st[1]) + "</td>" +
        "<td>" + (f.confidence == null ? "—" : Math.round(f.confidence * 100) + "%") + "</td>" +
        "<td>" + esc(SOURCE_LABEL[f.source] || f.source || "—") + "</td>" +
        "<td>" + (evidence || '<span class="ev">无</span>') + "</td>" +
        "</tr>";
    }).join("");
    $("pane-fields").innerHTML = '<table class="tbl fields"><thead><tr>' +
      "<th>字段</th><th>值</th><th>状态</th><th>置信度</th><th>来源</th><th>原文证据</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table>";
  }

  function renderReview(review) {
    if (!review.length) { $("pane-review").innerHTML = '<div class="empty">没有需要人工复核的项</div>'; return; }
    var order = { high: 0, medium: 1, low: 2 };
    review = review.slice().sort(function (a, b) {
      return (order[a.priority] == null ? 9 : order[a.priority]) - (order[b.priority] == null ? 9 : order[b.priority]);
    });
    $("pane-review").innerHTML = review.map(function (item) {
      var p = PRIORITY_LABEL[item.priority] || [item.priority || "", "t-mute"];
      var value = item.value === null || item.value === undefined || item.value === ""
        ? "—" : String(item.value);
      return '<div class="review-item ' + esc(item.priority || "") + '">' +
        '<div class="head">' + tag(p[0] + "风险", p[1]) +
        "<b>" + esc(item.label || item.key || "") + "</b></div>" +
        '<div class="issue">' + esc(item.issue || "") + "</div>" +
        '<div class="cur">当前值：<span class="val">' + esc(value) + "</span></div>" +
        "</div>";
    }).join("");
  }

  function renderTemplates(values, missing) {
    var keys = Object.keys(values);
    var html = "";
    if (keys.length) {
      html += '<div class="kv">';
      keys.forEach(function (k) {
        html += '<div class="k">' + esc(k) + '</div><div class="val">' + esc(values[k]) + "</div>";
      });
      html += "</div>";
    } else {
      html += '<div class="empty">没有可回填的模板字段</div>';
    }
    if (missing && missing.length) {
      html += '<div class="alert warn" style="margin-top:14px"><div class="grow"><b>模板缺失 ' +
        missing.length + " 项：</b>" + missing.map(esc).join("、") + "</div></div>";
    }
    $("pane-template").innerHTML = html;
  }

  // ---------------- 极简 Markdown 渲染 ----------------
  function inline(text) {
    return esc(text)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }

  function mdToHtml(md) {
    var lines = String(md || "").replace(/\r\n/g, "\n").split("\n");
    var out = [], list = null, table = [];

    function closeList() { if (list) { out.push("</" + list + ">"); list = null; } }
    function flushTable() {
      if (!table.length) return;
      var rows = table.map(function (row) {
        return row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
      });
      var header = rows[0] || [];
      out.push("<table><thead><tr>" + header.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead><tbody>");
      for (var i = 2; i < rows.length; i++) {
        out.push("<tr>" + rows[i].map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>");
      }
      out.push("</tbody></table>");
      table = [];
    }

    lines.forEach(function (raw) {
      var line = raw.replace(/\s+$/, "");
      if (/^\s*\|/.test(line)) { closeList(); table.push(line); return; }
      flushTable();
      if (!line) { closeList(); return; }

      var heading = /^(#{1,6})\s+(.*)$/.exec(line);
      if (heading) {
        closeList();
        var level = Math.min(3, heading[1].length);
        out.push("<h" + level + ">" + inline(heading[2]) + "</h" + level + ">");
        return;
      }
      if (/^(---+|\*\*\*+)$/.test(line.trim())) { closeList(); out.push("<hr>"); return; }
      if (/^>\s?/.test(line)) { closeList(); out.push("<blockquote>" + inline(line.replace(/^>\s?/, "")) + "</blockquote>"); return; }

      var bullet = /^\s*[-*+]\s+(.*)$/.exec(line);
      if (bullet) {
        if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
        out.push("<li>" + inline(bullet[1]) + "</li>");
        return;
      }
      var numbered = /^\s*\d+[.)]\s+(.*)$/.exec(line);
      if (numbered) {
        if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
        out.push("<li>" + inline(numbered[1]) + "</li>");
        return;
      }
      closeList();
      out.push("<p>" + inline(line) + "</p>");
    });
    flushTable(); closeList();
    return out.join("\n");
  }

  // ---------------- 提示 ----------------
  function showError(message) {
    $("error-text").textContent = message;
    $("error-card").classList.remove("hidden");
  }
  function hideError() { $("error-card").classList.add("hidden"); }

  // ---------------- 示例任务 ----------------
  // 参考图把「能做什么」直接摆在首屏，比空状态更有引导性；
  // 这里每条只是引导，点击后回到输入区并唤起文件选择，不改变业务状态。
  var SUGGESTIONS = {
    common: [
      "抽取结构化字段并附原文证据",
      "查看缺失项与待人工确认的字段",
      "生成可编辑的招标文件 .docx",
      "核对投标响应与资格要求的差距",
      "按项目归档多轮解析结果",
      "导出 JSON、审核报告与平台草稿"
    ],
    build: [
      "把标的清单填进招标文件表格",
      "逐条标注 ★ ▲ 实质性条款",
      "补齐商务要求与编制规范默认值",
      "导出 PDF 与平台草稿"
    ],
    check: [
      "比对招标要求与投标响应",
      "标记不满足与部分满足的条目",
      "检查模板占位符覆盖情况",
      "复核低置信与推断字段"
    ],
    keep: [
      "按采购项目归档任务",
      "恢复已归档项目继续编辑",
      "在企业档案里复用资质与业绩"
    ]
  };

  function renderSuggestions(tab) {
    var list = SUGGESTIONS[tab] || SUGGESTIONS.common;
    $("sugg-grid").innerHTML = list.map(function (text) {
      return '<a class="sugg-item" href="#" data-sugg="' + esc(text) + '">' +
        '<svg viewBox="0 0 24 24"><path d="M4 4v7a4 4 0 0 0 4 4h11"/><path d="M15 11l4 4-4 4"/></svg>' +
        "<span>" + esc(text) + "</span></a>";
    }).join("");
  }

  $("sugg-tabs").addEventListener("click", function (e) {
    var btn = e.target.closest(".sugg-tab");
    if (!btn) return;
    this.querySelectorAll(".sugg-tab").forEach(function (b) { b.classList.remove("on"); });
    btn.classList.add("on");
    renderSuggestions(btn.dataset.tab);
  });

  $("sugg-grid").addEventListener("click", function (e) {
    if (!e.target.closest(".sugg-item")) return;
    e.preventDefault();
    $("drop").scrollIntoView({ behavior: "smooth", block: "center" });
    setTimeout(function () { $("file").click(); }, 240);
  });

  renderSuggestions("common");

  // ---------------- 交互绑定 ----------------
  $("run").addEventListener("click", function () { startExtraction(false); });
  $("retry-force").addEventListener("click", function () { startExtraction(true); });
  document.querySelectorAll(".tabs button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".tabs button").forEach(function (b) { b.classList.remove("active"); });
      document.querySelectorAll(".pane").forEach(function (p) { p.classList.remove("active"); });
      btn.classList.add("active");
      $("pane-" + btn.dataset.pane).classList.add("active");
    });
  });

  loadHealth();
  loadProjects();

  // 打开/恢复一个任务：进行中则继续轮询，已完成则加载结果
  function openJob(jobId, resume) {
    $("status").classList.add("show");
    $("status-title").textContent = resume ? "检测到进行中的解析，正在恢复…" : "正在载入历史任务…";
    $("status-sub").textContent = jobId;
    $("run").disabled = true;
    fetch("/api/jobs/" + encodeURIComponent(jobId))
      .then(function (r) {
        return r.json().then(function (data) {
          if (!r.ok) throw new Error(data.error || ("请求失败 " + r.status));
          return data;
        });
      })
      .then(function (job) {
        if (job.status === "queued" || job.status === "running") {
          state.startedAt = Date.now();
          state.jobId = job.id;
          state.tick = setInterval(function () {
            $("status-elapsed").textContent = ((Date.now() - state.startedAt) / 1000).toFixed(1) + "s";
          }, 100);
          poll(job.id);
          return;
        }
        $("status").classList.remove("show");
        $("run").disabled = false;
        if (job.status === "error") { showError(job.error || "该任务执行失败"); return; }
        loadResult(job);
      })
      .catch(function (err) {
        $("status").classList.remove("show");
        $("run").disabled = false;
        showError("载入任务失败：" + (err.message || err));
      });
  }

  // 页面加载：优先 ?job= 指定任务；否则若后端有进行中的解析，自动恢复轮询，
  // 这样从填写工作台 / 项目工作台跳回来，解析进度依然可见、可继续。
  (function () {
    var jobId = new URLSearchParams(window.location.search).get("job");
    if (jobId) { openJob(jobId, false); return; }
    fetch("/api/jobs")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var active = (data.jobs || []).filter(function (j) {
          return j.kind === "extract" && (j.status === "queued" || j.status === "running");
        });
        if (active.length) { openJob(active[0].id, true); }
      })
      .catch(function () { /* 无进行中任务或查询失败，保持正常首页 */ });
  })();
})();

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业档案</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%232563eb'/%3E%3Cpath%20d='M10%207h8l5%205v13a1%201%200%200%201-1%201H10a1%201%200%200%201-1-1V8a1%201%200%200%201%201-1z'%20fill='%23fff'/%3E%3Cpath%20d='M18%207v5h5'%20fill='%23c2d8ff'/%3E%3Cpath%20d='M12.5%2016h7M12.5%2019.5h4.5'%20stroke='%232563eb'%20stroke-width='1.4'%20stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* 本页专属：档案小节标题、自动填充字段网格、可增删的行卡片 */
  h2.sec {
    font-family: var(--font-serif);
    font-size: 15px;
    font-weight: 400;
    color: var(--ink);
    margin: 26px 0 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line-soft);
  }
  h2.sec:first-child { margin-top: 0; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .form-grid label { display: block; color: var(--muted); font-size: 12px; }
  .form-grid input { width: 100%; margin-top: 4px; }

  .row-list { display: flex; flex-direction: column; gap: 8px; }
  .row-item {
    position: relative;
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 10px 12px;
    padding-right: 64px;
    background: var(--grey-25);
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 8px;
    align-items: end;
    transition: border-color .15s, background-color .15s;
  }
  .row-item:hover { border-color: var(--grey-300); background: #fff; }
  .row-item label { color: var(--muted); font-size: 11.5px; display: block; }
  .row-item input { width: 100%; margin-top: 3px; padding: 6px 9px; font-size: 12.5px; }
  /* 删除放在卡片右上角，避免整行按钮把卡片撑高 */
  .row-item .del { position: absolute; right: 10px; top: 10px; }

  .kv-list { display: flex; flex-direction: column; gap: 8px; }
  .kv-item { display: grid; grid-template-columns: minmax(140px, 240px) minmax(0, 1fr) auto; gap: 8px; }
  .kv-item input { width: 100%; min-width: 0; padding: 6px 9px; font-size: 12.5px; }
  .kv-item input[data-k] { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
  .kv-item .btn { align-self: center; }
  .kv-item .btn.danger { padding-left: 8px; padding-right: 8px; }

  .ok-msg { color: var(--green); font-size: 13px; display: none; }
  .ok-msg.show { display: inline; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
</style>
</head>
<body>
<div class="shell">
  <main class="main">
    <div class="main-inner">
      <div class="page-head">
        <h1>企业档案</h1>
        <p>投标书生成的素材库：录入一次，后续每个项目自动复用</p>
      </div>

      <div class="alert error hidden" id="error" style="margin-bottom:14px"></div>

  <section class="card">
    <h2 class="sec">基本信息</h2>
    <div class="form-grid" id="basic"></div>

    <h2 class="sec">资质证书</h2>
    <div class="row-list" id="qualifications"></div>
    <button class="btn small" id="add-q" style="margin-top:8px">＋ 添加资质</button>

    <h2 class="sec">同类项目业绩</h2>
    <div class="row-list" id="performances"></div>
    <button class="btn small" id="add-p" style="margin-top:8px">＋ 添加业绩</button>

    <h2 class="sec">拟投入人员</h2>
    <div class="row-list" id="personnel"></div>
    <button class="btn small" id="add-r" style="margin-top:8px">＋ 添加人员</button>

    <h2 class="sec">证明材料索引</h2>
    <p class="hint">key 对应资格要求自动映射（如 business_license、sme），值写材料位置或说明。</p>
    <div class="kv-list" id="evidence"></div>
    <button class="btn small" id="add-e" style="margin-top:8px">＋ 添加材料</button>

    <div class="actions" style="margin-top:20px">
      <button class="btn primary" id="save">保存档案</button>
      <span class="ok-msg" id="ok">已保存</span>
    </div>
  </section>

      <footer>档案保存在本机 data/tender.db；投标书生成会自动引用这里的资质与业绩</footer>
    </div>
  </main>
</div>

<script src="/assets/shell.js"></script>
<script src="/assets/company.js"></script>
</body>
</html>

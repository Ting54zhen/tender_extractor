<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可视化设置</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%232563eb'/%3E%3Cpath%20d='M10%207h8l5%205v13a1%201%200%200%201-1%201H10a1%201%200%200%201-1-1V8a1%201%200%200%201%201-1z'%20fill='%23fff'/%3E%3Cpath%20d='M18%207v5h5'%20fill='%23c2d8ff'/%3E%3Cpath%20d='M12.5%2016h7M12.5%2019.5h4.5'%20stroke='%232563eb'%20stroke-width='1.4'%20stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* 本页专属：左侧标签 + 右侧控件的设置表单 */
  h2.sec {
    font-family: var(--font-serif);
    font-size: 15px;
    font-weight: 400;
    color: var(--ink);
    margin: 26px 0 4px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line-soft);
  }
  h2.sec:first-child { margin-top: 0; }

  .form-grid {
    display: grid;
    grid-template-columns: minmax(180px, 236px) minmax(0, 1fr);
    align-items: start;
    font-size: 13px;
  }
  .form-grid > label {
    padding: 10px 12px 10px 0;
    color: var(--grey-700);
    font-size: 13px;
    border-bottom: 1px solid var(--grey-100);
    line-height: 1.5;
  }
  .form-grid > label small {
    display: block;
    font-size: 11.5px;
    color: var(--grey-400);
    margin-top: 2px;
    line-height: 1.5;
  }
  .form-grid > div {
    padding: 7px 0;
    border-bottom: 1px solid var(--grey-100);
  }
  .form-grid input[type="text"],
  .form-grid input[type="number"],
  .form-grid select { width: 100%; max-width: 520px; }
  .form-grid input[type="checkbox"] { margin-top: 6px; }

  /* 「已覆盖」标记：与出厂默认不同才出现 */
  .ovv {
    display: inline-flex;
    align-items: center;
    margin-left: 6px;
    padding: 0 6px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--amber);
    background: var(--amber-soft);
    border: 1px solid var(--amber-line);
    vertical-align: 1px;
  }

  .ok-msg { color: var(--green); font-size: 13px; display: none; }
  .ok-msg.show { display: inline; }

  @media (max-width: 720px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-grid > label { padding: 12px 0 2px; border-bottom: none; }
    .form-grid > div { padding: 0 0 10px; }
    .form-grid > div:first-of-type { padding-top: 6px; }
  }
</style>
</head>
<body>
<div class="shell">
  <main class="main">
    <div class="main-inner narrow">
      <div class="page-head">
        <h1>设置</h1>
        <p>出厂默认来自 config/settings.json；此处保存的覆盖值存于本机数据库，立即生效</p>
      </div>

      <div class="alert error hidden" id="error" style="margin-bottom:14px"></div>

  <section class="card">
    <h2 class="sec">模型接入（抽取）</h2>
    <div class="form-grid" id="form-llm"></div>

    <h2 class="sec">第三方复核</h2>
    <div class="form-grid" id="form-review"></div>

    <h2 class="sec">抽取与校验</h2>
    <div class="form-grid" id="form-extraction"></div>

    <h2 class="sec">输出</h2>
    <div class="form-grid" id="form-output"></div>

    <div class="actions">
      <button class="btn primary" id="save">保存设置</button>
      <button class="btn" id="reset">恢复出厂默认（清除覆盖）</button>
      <span class="ok-msg" id="ok">已保存并生效</span>
    </div>
  </section>

      <footer>覆盖值保存在本机 data/tender.db；角标「已覆盖」表示该项与出厂默认不同</footer>
    </div>
  </main>
</div>

<script src="/assets/shell.js"></script>
<script src="/assets/settings.js"></script>
</body>
</html>

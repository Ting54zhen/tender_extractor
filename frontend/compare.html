<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双文档符合性比对</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --line: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --green: #059669;
    --green-soft: #ecfdf5;
    --amber: #b45309;
    --amber-soft: #fffbeb;
    --red: #dc2626;
    --red-soft: #fef2f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .brand h1 { margin: 0; font-size: 19px; letter-spacing: .2px; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px; font-size: 12.5px;
    border: 1px solid var(--line); background: #fff; color: var(--muted);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; }
  .badge.ok { color: var(--green); background: var(--green-soft); border-color: #a7f3d0; }
  .badge.ok .dot { background: var(--green); }
  .badge.bad { color: var(--red); background: var(--red-soft); border-color: #fecaca; }
  .badge.bad .dot { background: var(--red); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
  }
  .card + .card { margin-top: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 780px) { .grid2 { grid-template-columns: 1fr; } }
  .label { font-weight: 600; margin-bottom: 8px; }
  .label small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .dropzone {
    border: 1.5px dashed #cbd5e1; border-radius: 12px; padding: 26px 18px;
    text-align: center; cursor: pointer; transition: .15s; background: #fcfcfd;
  }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone.filled { border-style: solid; border-color: #a7f3d0; background: var(--green-soft); }
  .dropzone .big { font-size: 14.5px; font-weight: 600; margin-bottom: 4px; }
  .dropzone .hint { color: var(--muted); font-size: 12.5px; word-break: break-all; }
  .options { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; margin-top: 16px; }
  .options label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: #374151; }
  .actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--text);
    padding: 9px 16px; border-radius: 9px; font-size: 13.5px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
    transition: .15s;
  }
  .btn:hover { border-color: #cbd5e1; background: #fafafa; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
  .btn.primary:disabled { background: #93b4f8; border-color: #93b4f8; cursor: not-allowed; }
  .btn.small { padding: 6px 11px; font-size: 12.5px; }
  .hintline { color: var(--muted); font-size: 12.5px; }
  .status { display: none; }
  .status.show { display: block; }
  .status .row { display: flex; align-items: center; gap: 12px; }
  .status .row .grow { flex: 1; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%; flex: none;
    border: 2px solid #dbeafe; border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bar { height: 4px; border-radius: 999px; background: #eef2f7; margin-top: 14px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 35%; border-radius: 999px; background: var(--accent); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
  .alert { border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  .alert[hidden] { display: none; }
  .alert.error { background: var(--red-soft); border: 1px solid #fecaca; color: #991b1b; }
  .alert.warn { background: var(--amber-soft); border: 1px solid #fde68a; color: #92400e; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { border: 1px solid var(--line); border-radius: 11px; padding: 11px 14px; background: #fcfcfd; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 19px; font-weight: 650; margin-top: 2px; }
  .tbl-wrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th {
    text-align: left; font-weight: 600; color: var(--muted); font-size: 12px;
    padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: #fbfbfc;
  }
  .tbl td { padding: 9px 10px; border-bottom: 1px solid #f1f2f4; vertical-align: top; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl .idx { color: var(--muted); white-space: nowrap; }
  .verdict {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .verdict.satisfied { color: var(--green); background: var(--green-soft); border: 1px solid #a7f3d0; }
  .verdict.partial { color: var(--amber); background: var(--amber-soft); border: 1px solid #fde68a; }
  .verdict.missing { color: var(--red); background: var(--red-soft); border: 1px solid #fecaca; }
  .cell-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
  details { margin-top: 18px; }
  summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  pre {
    background: #0f172a; color: #e2e8f0; padding: 16px; border-radius: 10px;
    overflow: auto; font-size: 12.5px; line-height: 1.6; margin-top: 10px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>双文档符合性比对</h1>
      <p>招标要求 vs 投标响应 · 逐条判定 · 证据回链</p>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="badge" id="health-badge"><span class="dot"></span><span id="health-text">检查模型…</span></span>
      <a class="btn small" href="/">单文档解析</a>
    </div>
  </header>

  <section class="card">
    <div class="grid2">
      <div>
        <div class="label">招标文件<small>要求什么</small></div>
        <div class="dropzone" id="drop-tender">
          <div class="big">点击或拖入招标文件</div>
          <div class="hint" id="hint-tender">支持 .docx / .pdf / .txt，最大 50MB</div>
        </div>
      </div>
      <div>
        <div class="label">投标文件<small>能提供什么</small></div>
        <div class="dropzone" id="drop-bid">
          <div class="big">点击或拖入投标文件</div>
          <div class="hint" id="hint-bid">支持 .docx / .pdf / .txt，最大 50MB</div>
        </div>
      </div>
    </div>

    <input type="file" id="file-tender" accept=".docx,.pdf,.txt" hidden>
    <input type="file" id="file-bid" accept=".docx,.pdf,.txt" hidden>

    <div class="options">
      <label><input type="checkbox" id="use-llm" checked> 使用模型（关闭后无法完成比对）</label>
    </div>

    <div class="actions">
      <button class="btn primary" id="run" disabled>开始比对</button>
      <span class="hintline" id="run-hint">先选择招标文件与投标文件</span>
    </div>

    <div class="alert error" id="error" hidden></div>
  </section>

  <section class="status card" id="status">
    <div class="row">
      <div class="spinner"></div>
      <div class="grow">
        <b id="status-title">准备中</b>
        <div class="hintline" id="status-sub"></div>
      </div>
      <div class="hintline" id="status-elapsed"></div>
    </div>
    <div class="bar"><i></i></div>
  </section>

  <section class="card hidden" id="result">
    <div class="stats" id="stats"></div>
    <div class="alert warn" id="warn" hidden></div>
    <div class="tbl-wrap">
      <table class="tbl" id="tbl">
        <thead>
          <tr>
            <th>#</th>
            <th>招标资格要求</th>
            <th>判定</th>
            <th>命中的投标响应</th>
            <th>依据</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <details id="report-box">
      <summary>查看完整比对报告（Markdown）</summary>
      <pre id="report"></pre>
    </details>
  </section>
</div>

<script>
(function () {
  "use strict";

  var state = { tender: null, bid: null, jobId: null, timer: null, tick: null, startedAt: 0 };
  var VERDICT_TEXT = { satisfied: "满足", partial: "部分满足", missing: "未响应" };

  function $(id) { return document.getElementById(id); }
  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1024 / 1024).toFixed(1) + " MB";
  }
  function showError(message) {
    var box = $("error");
    box.textContent = message;
    box.hidden = false;
  }
  function hideError() { $("error").hidden = true; }

  // ---------------- 健康检查 ----------------
  function loadHealth() {
    var badge = $("health-badge");
    badge.className = "badge";
    $("health-text").textContent = "检查模型…";
    fetch("/api/health").then(function (r) { return r.json(); }).then(function (data) {
      if (data.available) {
        badge.className = "badge ok";
        $("health-text").textContent = "模型就绪 · " + (data.model || data.provider || "");
      } else {
        badge.className = "badge bad";
        $("health-text").textContent = "模型不可用";
      }
    }).catch(function () {
      badge.className = "badge bad";
      $("health-text").textContent = "无法获取状态";
    });
  }

  // ---------------- 文件选择 ----------------
  function bindSlot(which) {
    var drop = $("drop-" + which);
    var input = $("file-" + which);
    var hint = $("hint-" + which);

    drop.addEventListener("click", function () { input.click(); });
    input.addEventListener("change", function (e) { setFile(which, e.target.files[0]); });

    ["dragenter", "dragover"].forEach(function (name) {
      drop.addEventListener(name, function (e) {
        e.preventDefault(); drop.classList.add("over");
      });
    });
    ["dragleave", "drop"].forEach(function (name) {
      drop.addEventListener(name, function (e) {
        e.preventDefault(); drop.classList.remove("over");
      });
    });
    drop.addEventListener("drop", function (e) {
      if (e.dataTransfer.files && e.dataTransfer.files.length) {
        setFile(which, e.dataTransfer.files[0]);
      }
    });
    drop._hint = hint;
  }

  function setFile(which, file) {
    if (!file) return;
    var lower = file.name.toLowerCase();
    if (!/\.(docx|pdf|txt)$/.test(lower)) {
      showError("不支持的文件类型：" + file.name + "，仅支持 .docx / .pdf / .txt");
      return;
    }
    if (file.size > 50 * 1024 * 1024) {
      showError("文件超过 50MB 上限：" + file.name);
      return;
    }
    state[which] = file;
    var drop = $("drop-" + which);
    drop.classList.add("filled");
    $("hint-" + which).textContent = file.name + " · " + fmtSize(file.size);
    hideError();
    refreshRunState();
  }

  function refreshRunState() {
    var ready = !!(state.tender && state.bid);
    $("run").disabled = !ready;
    $("run-hint").textContent = ready ? "准备就绪" : "先选择招标文件与投标文件";
  }

  bindSlot("tender");
  bindSlot("bid");

  // ---------------- 提交与轮询 ----------------
  function submitCompare() {
    if (!state.tender || !state.bid) { showError("请先选择两个文件"); return; }
    hideError();
    $("result").classList.add("hidden");
    $("warn").hidden = true;

    var form = new FormData();
    form.append("tender", state.tender, state.tender.name);
    form.append("bid", state.bid, state.bid.name);
    form.append("use_llm", $("use-llm").checked ? "1" : "0");

    $("status").classList.add("show");
    $("status-title").textContent = "正在上传…";
    $("status-sub").textContent = state.tender.name + "  vs  " + state.bid.name;
    $("run").disabled = true;
    $("run-hint").textContent = "比对中，请稍候";

    fetch("/api/compare", { method: "POST", body: form })
      .then(function (r) {
        return r.json().then(function (data) {
          if (!r.ok) throw new Error(data.error || ("请求失败 " + r.status));
          return data;
        });
      })
      .then(function (job) {
        state.jobId = job.id;
        beginTicking();
        poll(job.id);
      })
      .catch(function (err) {
        stopTicking();
        $("status").classList.remove("show");
        $("run").disabled = false;
        $("run-hint").textContent = "准备就绪";
        showError(err.message || String(err));
      });
  }

  function beginTicking() {
    stopTicking();
    state.startedAt = Date.now();
    state.tick = setInterval(function () {
      $("status-elapsed").textContent = ((Date.now() - state.startedAt) / 1000).toFixed(1) + "s";
    }, 100);
  }
  function stopTicking() {
    if (state.tick) { clearInterval(state.tick); state.tick = null; }
  }

  function poll(jobId) {
    fetch("/api/jobs/" + jobId).then(function (r) { return r.json(); }).then(function (job) {
      $("status-title").textContent = job.stage || "处理中";
      $("status-sub").textContent = job.use_llm
        ? "抽取招标要求 → 抽取投标响应 → 逐条比对"
        : "已关闭模型，无法完成比对";
      if (job.status === "queued" || job.status === "running") {
        state.timer = setTimeout(function () { poll(jobId); }, 900);
        return;
      }
      stopTicking();
      $("status").classList.remove("show");
      $("run").disabled = false;
      $("run-hint").textContent = "准备就绪";
      if (job.status === "error") { showError(job.error || "比对失败"); return; }
      loadCompare(job);
    }).catch(function (err) {
      stopTicking();
      $("status").classList.remove("show");
      $("run").disabled = false;
      showError("获取任务状态失败：" + (err.message || err));
    });
  }

  function loadCompare(job) {
    fetch("/api/jobs/" + job.id + "/compare").then(function (r) { return r.json(); }).then(function (payload) {
      render(job, payload);
    }).catch(function (err) {
      showError("读取比对结果失败：" + (err.message || err));
    });
  }

  // ---------------- 渲染 ----------------
  function render(job, payload) {
    var summary = job.summary || {};
    var results = payload.results || [];
    $("result").classList.remove("hidden");

    var stats = [
      ["资格要求", summary.requirements || 0, ""],
      ["投标响应", summary.responses || 0, ""],
      ["满足", summary.satisfied || 0, summary.satisfied ? "color:var(--green)" : ""],
      ["部分满足", summary.partial || 0, summary.partial ? "color:var(--amber)" : ""],
      ["未响应", summary.missing || 0, summary.missing ? "color:var(--red)" : ""],
      ["用时", (job.elapsed || 0) + "s", ""]
    ];
    $("stats").innerHTML = stats.map(function (item) {
      return '<div class="stat"><div class="k">' + esc(item[0]) + '</div>' +
        '<div class="v" style="' + item[2] + '">' + esc(item[1]) + '</div></div>';
    }).join("");

    if (!results.length) {
      $("warn").hidden = false;
      $("warn").textContent = "没有得到比对结论：可能是模型不可用、未抽取到资格要求，或投标文件未提供响应。";
    } else {
      $("warn").hidden = true;
    }

    $("tbody").innerHTML = results.map(function (item, index) {
      var verdict = item.verdict || "missing";
      var label = VERDICT_TEXT[verdict] || verdict;
      var matched = item.matched_response
        ? esc(item.matched_response) + '<div class="cell-sub">' + esc(item.resp_evidence || "") + '</div>'
        : '<span class="hintline">—</span>';
      return '<tr>' +
        '<td class="idx">' + (index + 1) + '</td>' +
        '<td>' + esc(item.requirement || "") + '<div class="cell-sub">' + esc(item.req_evidence || "") + '</div></td>' +
        '<td><span class="verdict ' + esc(verdict) + '">' + esc(label) + '</span></td>' +
        '<td>' + matched + '</td>' +
        '<td>' + esc(item.note || "") + '</td>' +
        '</tr>';
    }).join("");

    $("report").textContent = payload.report || "（无报告）";
  }

  $("run").addEventListener("click", submitCompare);
  $("refresh-health") && $("refresh-health").addEventListener("click", loadHealth);

  loadHealth();
})();
</script>
</body>
</html>
